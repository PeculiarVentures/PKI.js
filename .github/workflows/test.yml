name: Test

# Pushes to master are tested by Publish, which calls this workflow before release-please.
on:
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Check generated package exports are committed
        run: git diff --exit-code package.json

      - name: Run test with coverage
        run: npm run coverage

      - name: Coveralls
        uses: coverallsapp/github-action@v2
